syntax = "proto3";

import "phoenix/protobuf/decimal.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Tgs.GameInterface.Cards365.Protos";

package gameinterfacecards365;

// The greeting service definition.
service GameInterfaceCards365 {
  // Sends a greeting
  rpc PlayerCreate (PlayerCreateRequest) returns (BaseReply);
  rpc PlayerBalance (PlayerBalanceRequest) returns (PlayerBalanceReply);
  rpc PlayerLogout (PlayerLogoutRequest) returns (BaseReply);
  rpc FundIn (FundRequest) returns (FundReply);
  rpc FundOut (FundRequest) returns (FundReply);
  rpc FundStatus(FundStatusRequest) returns (BaseReply);
  rpc GameUrl (GameUrlRequest) returns (GameUrlReply);
  rpc GameWagerByBetTime (GameWagerByBetTimeRequest) returns (GameWagerReply);
  rpc GameWagerByLastUpdate (GameWagerByLastUpdateRequest) returns (GameWagerReply);
  rpc GameWagerByPayTime (GameWagerByPayTimeRequest) returns (GameWagerReply);
  rpc CheckingService(CheckingServiceRequest) returns (CheckingServiceReply);
}

// The request message containing the user's name.
message PlayerCreateRequest {
	string api_url = 1;
	string website = 2;
	string cert = 3;
	string extension1 = 4;
	string player_code = 5;
    int32 currency = 6;
}

message PlayerBalanceRequest {
	string api_url = 1;
	string website = 2;
	string cert = 3;
	string player_code = 4;
}

message PlayerLogoutRequest {
	string api_url = 1;
	string website = 2;
	string cert = 3;
	string extension1 = 4;
	string player_code = 5;
}

message FundRequest {
	string api_url = 1;
	string website = 2;
	string cert = 3;
	string extension1 = 4;
	string player_code = 5;
	string transaction_id = 6;
	phoenix.protobuf.DecimalValue amount = 7;
}

message FundStatusRequest {
	string api_url = 1;
	string website = 2;
	string cert = 3;
	string transaction_id = 4;
}

message GameUrlRequest {
	string api_url = 1;
	string website = 2;
	string cert = 3;
	string extension1 = 4;
	string player_code = 5;
    int32 currency = 6;
	string language = 7;
}

message GameWagerByBetTimeRequest {
	string api_url = 1;
	string website = 2;
	string cert = 3;
	string extension1 = 4;
	google.protobuf.Timestamp start_time = 5;
	google.protobuf.Timestamp end_time = 6;
}

message GameWagerByLastUpdateRequest {
	string api_url = 1;
	string website = 2;
	string cert = 3;
	string extension1 = 4;
	int64 lastupdatedate = 5;
}

message GameWagerByPayTimeRequest {
	string api_url = 1;
	string website = 2;
	string cert = 3;
	string extension1 = 4;
	google.protobuf.Timestamp start_time = 5;
	google.protobuf.Timestamp end_time = 6;
}

message CheckingServiceRequest{
    string machine_name = 1;
}

// The response message containing the greetings.
message BaseReply {
	bool state = 1;
}

message PlayerBalanceReply {
	bool is_player_exist = 1;
	phoenix.protobuf.DecimalValue balance = 2;
}

message FundReply {
	string transaction_id = 1;
	string resp = 2;
}

message GameUrlReply{
	string game_url = 1;
}

message GameWagerReply {
	repeated GameWagerInfo items = 1;
}

message GameWagerInfo {
	string external_round_id = 1;
	string external_wager_id = 2;
	string external_game_id = 3;
    string player_code = 4;
    bool is_closed = 5;
    bool is_void = 6;
    google.protobuf.Timestamp update_time = 7;
    google.protobuf.Timestamp external_created_on = 8;
    google.protobuf.Timestamp external_closed_on = 9;
    phoenix.protobuf.DecimalValue bet = 10;
    phoenix.protobuf.DecimalValue valid_bet = 11;
	phoenix.protobuf.DecimalValue settle = 12;
    phoenix.protobuf.DecimalValue winloss = 13;
    phoenix.protobuf.DecimalValue commission = 14;
    string additional_data = 15;
}

message CheckingServiceReply{
    string machine_name = 1;
}